<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>eBayの許可が出ました</title>
<style>
body{font-family:-apple-system,"Hiragino Sans",sans-serif;max-width:560px;margin:40px auto;padding:0 16px;line-height:1.8;color:#222}
h1{font-size:1.4rem}
button{font-size:1.4rem;padding:18px 32px;border:0;border-radius:10px;background:#0654ba;color:#fff;cursor:pointer;margin:16px 0}
#msg{color:#1a7f37;font-weight:bold;min-height:1.8em}
.note{font-size:.9rem;color:#555}
</style>
</head>
<body>
<h1 id="ttl">eBayの許可が出ました。</h1>
<p id="lead">この画面の上のアドレス欄の文字を全部コピーして、AIに貼ってください。</p>
<button id="copy" type="button">アドレスをコピー</button>
<div id="msg" aria-live="polite"></div>
<p class="note" id="note">このページは何も送信しません。コピーはお使いのパソコンの中だけで行われます。ボタンが効かないときは、上のアドレス欄をクリックして全部選び、コピーしてください。</p>
<script>
(function () {
  var has = false;
  try { has = !!new URLSearchParams(location.search).get('code'); } catch (e) { has = false; }
  if (!has) {
    document.title = 'eBayの許可が出ませんでした';
    document.getElementById('ttl').textContent = 'eBayの許可が出ませんでした。';
    var lead = document.getElementById('lead');
    lead.textContent = '許可が出ませんでした（取り消した、またはエラー）。AIにそう伝えてください。';
    lead.style.color = '#b42318';
    lead.style.fontWeight = 'bold';
    document.getElementById('copy').style.display = 'none';
    document.getElementById('note').style.display = 'none';
  }
})();
document.getElementById('copy').addEventListener('click', function () {
  var msg = document.getElementById('msg');
  var text = location.href;
  function ok() { msg.textContent = 'コピーしました。AIに貼り付けてください。'; }
  function ng() { msg.textContent = 'コピーできませんでした。アドレス欄から手でコピーしてください。'; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(ok, ng);
  } else { ng(); }
});
</script>
</body>
</html>
